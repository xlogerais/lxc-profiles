---
name: user-xavier
description: Personnal environment for Xavier
config:
  cloud-init.user-data: |
    #cloud-config

    timezone: Europe/Paris
    locale: fr_FR.UTF-8

    # Packages
    package_update: true
    package_upgrade: true
    packages:
      - git

    users:
      - name: xavier
        groups: sudo
        shell: /bin/bash
        sudo: ['ALL=(ALL) NOPASSWD:ALL']
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBlon0OAAt/wQmuP/BDY/m4qJgUgNY1a7xXUgPpfCXe4 xavier@intel-nuc-hades-canyon
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMi/CnrkifO0e78Oj1tdLTILc4yuJ18em4W/2fDte9Kq ubuntu@cloud.logerais.com

    runcmd:
      - su - xavier -c "git clone https://gitea.cloud.logerais.com/xavier/config-bootstrap.git ~/.bootstrap"
      - su - xavier -c "bash ~/.bootstrap/bootstrap.bash"
