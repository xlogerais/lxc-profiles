name: lxd-host-socket
description: "Permet à un container d'accéder au démon LXD de l'hôte via le socket Unix"
devices:
  lxd-socket:
    type: proxy
    listen: unix:/var/snap/lxd/common/lxd/unix.socket
    connect: unix:/var/snap/lxd/common/lxd/unix.socket
    uid: 0
    gid: 0
    mode: "0660"
config:
  cloud-init.vendor-data: |
    #cloud-config
    package_update: true
    packages:
      - snapd
    runcmd:
      - snap install lxd --channel=latest/stable